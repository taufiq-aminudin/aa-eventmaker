<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="swooshBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="swooshOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="calendarBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15" flood-color="#0f172a"/>
    </filter>
  </defs>

  <!-- Left Blue Stylized 'A' -->
  <path d="M195 90 L115 315 H175 L192 265 H245 L260 215 H209 L220 180 L238 215 L275 125 Z" 
        fill="url(#blueGradient)" filter="url(#dropShadow)"/>
  
  <!-- Right Orange Stylized 'A' overlapping -->
  <path d="M285 95 L225 315 H280 L295 265 H365 L382 315 H445 L365 95 H310 Z" 
        fill="url(#orangeGradient)" filter="url(#dropShadow)"/>
  <!-- Orange A inner triangle cutout -->
  <polygon points="330,150 308,225 352,225" fill="#ffffff"/>

  <!-- Left Blue Dynamic Orbit Swoosh -->
  <path d="M80 280 C 60 320, 110 365, 230 350 C 170 345, 120 325, 105 300 C 95 285, 110 265, 140 245 C 105 255, 85 265, 80 280 Z" 
        fill="url(#swooshBlue)"/>
  <path d="M90 280 C 120 330, 210 355, 310 330 C 230 345, 150 335, 110 295 C 100 285, 95 275, 90 280 Z" 
        fill="url(#swooshBlue)"/>

  <!-- Right Vibrant Orange Orbit Swoosh sweeping upwards toward calendar -->
  <path d="M230 350 C 330 345, 410 300, 460 215 C 430 255, 360 295, 270 315 C 240 322, 230 335, 230 350 Z" 
        fill="url(#swooshOrange)"/>

  <!-- Calendar Icon Badge at Top Right -->
  <g transform="translate(365, 75)" filter="url(#dropShadow)">
    <!-- Calendar Body -->
    <rect x="0" y="8" width="68" height="64" rx="14" fill="url(#calendarBg)"/>
    <!-- Top Header Stripe -->
    <rect x="0" y="8" width="68" height="18" rx="14" fill="#1e3a8a"/>
    <rect x="0" y="20" width="68" height="6" fill="#1e3a8a"/>
    <!-- Binder Rings -->
    <rect x="14" y="2" width="7" height="14" rx="3.5" fill="#ffffff"/>
    <rect x="47" y="2" width="7" height="14" rx="3.5" fill="#ffffff"/>
    <!-- 6 White Calendar Dots (3 x 2 grid) -->
    <circle cx="19" cy="38" r="3.5" fill="#ffffff"/>
    <circle cx="34" cy="38" r="3.5" fill="#ffffff"/>
    <circle cx="49" cy="38" r="3.5" fill="#ffffff"/>
    <circle cx="19" cy="54" r="3.5" fill="#ffffff"/>
    <circle cx="34" cy="54" r="3.5" fill="#ffffff"/>
    <circle cx="49" cy="54" r="3.5" fill="#ffffff"/>
  </g>
</svg>
