<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" fill="none">
  <defs>
    <linearGradient id="logoBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="logoOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="swB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="swO" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
  </defs>

  <!-- Left Mark (scaled to fit within 200x200) -->
  <g transform="translate(10, 10) scale(0.48)">
    <path d="M195 90 L115 315 H175 L192 265 H245 L260 215 H209 L220 180 L238 215 L275 125 Z" fill="url(#logoBlue)"/>
    <path d="M285 95 L225 315 H280 L295 265 H365 L382 315 H445 L365 95 H310 Z" fill="url(#logoOrange)"/>
    <polygon points="330,150 308,225 352,225" fill="#ffffff"/>
    <path d="M80 280 C 60 320, 110 365, 230 350 C 170 345, 120 325, 105 300 C 95 285, 110 265, 140 245 C 105 255, 85 265, 80 280 Z" fill="url(#swB)"/>
    <path d="M90 280 C 120 330, 210 355, 310 330 C 230 345, 150 335, 110 295 C 100 285, 95 275, 90 280 Z" fill="url(#swB)"/>
    <path d="M230 350 C 330 345, 410 300, 460 215 C 430 255, 360 295, 270 315 C 240 322, 230 335, 230 350 Z" fill="url(#swO)"/>
    <!-- Calendar Badge -->
    <g transform="translate(365, 75)">
      <rect x="0" y="8" width="68" height="64" rx="14" fill="#1d4ed8"/>
      <rect x="0" y="8" width="68" height="18" rx="14" fill="#1e3a8a"/>
      <rect x="0" y="20" width="68" height="6" fill="#1e3a8a"/>
      <rect x="14" y="2" width="7" height="14" rx="3.5" fill="#ffffff"/>
      <rect x="47" y="2" width="7" height="14" rx="3.5" fill="#ffffff"/>
      <circle cx="19" cy="38" r="3.5" fill="#ffffff"/>
      <circle cx="34" cy="38" r="3.5" fill="#ffffff"/>
      <circle cx="49" cy="38" r="3.5" fill="#ffffff"/>
      <circle cx="19" cy="54" r="3.5" fill="#ffffff"/>
      <circle cx="34" cy="54" r="3.5" fill="#ffffff"/>
      <circle cx="49" cy="54" r="3.5" fill="#ffffff"/>
    </g>
  </g>

  <!-- Typography -->
  <!-- "AA-" -->
  <text x="235" y="115" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="70" font-weight="900" fill="#1d4ed8" letter-spacing="-1.5">AA-</text>
  <!-- "EventMaker" -->
  <text x="365" y="115" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="70" font-weight="900" fill="#0f172a" letter-spacing="-1.5">EventMaker</text>
  
  <!-- Tagline: Plan • Manage • Make It Happen -->
  <text x="240" y="165" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="600" fill="#64748b" letter-spacing="3.5">
    PLAN <tspan fill="#f97316" font-size="26">•</tspan> MANAGE <tspan fill="#1d4ed8" font-size="26">•</tspan> MAKE IT HAPPEN
  </text>
</svg>
