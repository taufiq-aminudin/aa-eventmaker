<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><title>Analytics — AA : Event Maker</title>
<link rel="stylesheet" href="styles.css"></head>
<body class="" data-active="">
<div id="masterHeader"></div>

<main class="container"><div class="page-top"><a class="back" href="dashboard.html">← Project Workspace</a><span class="pill">📊 Analytics</span></div><span class="eyebrow">ANALYTICS</span><h1>See what is happening.</h1><p class="lead">Project engagement at a glance.</p>
<section class="stat-grid section"><div class="stat"><span>Invitation views</span><b id="aViews">0</b></div><div class="stat"><span>Shares</span><b id="aShares">0</b></div><div class="stat"><span>Confirmed</span><b id="aConfirmed">0</b></div><div class="stat"><span>Check-ins</span><b id="checkins">0</b></div></section>
<section class="split section"><div class="card"><span class="eyebrow">RSVP</span><h2 id="rate">0%</h2><div style="height:10px;background:#eef0f4;border-radius:99px;overflow:hidden"><i id="bar" style="display:block;width:0;height:100%;background:linear-gradient(90deg,#6d28d9,#ec4899)"></i></div><div class="list" style="margin-top:16px"><div class="list-row"><span>Confirmed</span><b id="aConfirmed2">0</b></div><div class="list-row"><span>Declined</span><b id="aDeclined">0</b></div><div class="list-row"><span>Pending / Maybe</span><b id="aPending">0</b></div></div></div><div class="card"><span class="eyebrow">SHARE</span><h2>Public invitation</h2><p class="muted">Publish or share the invitation from the Invitation Maker.</p><div class="actions"><a class="btn primary" href="invitation-maker.html">Manage Invitation</a><button class="btn light" onclick="shareInvitation()">Share Link</button></div></div></section>
</main>
<script>document.addEventListener('DOMContentLoaded',()=>{const a=guests(),i=invitation()||{},c=a.filter(x=>x.rsvp==='Confirmed').length,d=a.filter(x=>x.rsvp==='Declined').length,m=a.length-c-d;for(const [id,v] of [['aViews',i.views||0],['aShares',i.shareCount||0],['aConfirmed',c],['aConfirmed2',c],['aDeclined',d],['aPending',m],['checkins',a.filter(x=>x.checkedIn).length]])if(by(id))by(id).textContent=v;const r=a.length?Math.round(c/a.length*100):0;by('rate').textContent=r+'%';by('bar').style.width=r+'%'});</script>

<div id="masterFooter"></div>
<script src="app.js"></script></body></html>
