<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Analytics — AA : Event Maker</title><link rel="stylesheet" href="workspace.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">AA<span>:</span></span><span>Event Maker</span></a><nav class="nav"><a href="dashboard.html">Dashboard</a><a class="active" href="analytics.html">Analytics</a><a href="guest-manager.html">Guests</a></nav></header><main class="container"><span class="eyebrow">EVENT ANALYTICS</span><h1>See how your event is progressing.</h1><div class="stats section"><div class="stat"><span class="muted">Guests</span><b id="guests">0</b></div><div class="stat"><span class="muted">Confirmed</span><b id="confirmed">0</b></div><div class="stat"><span class="muted">Pending</span><b id="pending">0</b></div><div class="stat"><span class="muted">Tasks done</span><b id="tasks">0%</b></div></div><section class="card section"><h2>Project health</h2><div class="list"><div class="list-row"><span>Invitation</span><strong id="inv">Not started</strong></div><div class="list-row"><span>Guests & RSVP</span><strong id="gst">Not started</strong></div><div class="list-row"><span>Location</span><strong id="loc">Not started</strong></div><div class="list-row"><span>Planner</span><strong id="pln">Not started</strong></div><div class="list-row"><span>Budget</span><strong id="bud">Not started</strong></div></div></section></main><script>const g=JSON.parse(localStorage.getItem('aaem_guests')||'[]');guests.textContent=g.length;confirmed.textContent=g.filter(x=>x.rsvp==='Confirmed').length;pending.textContent=g.filter(x=>x.rsvp!=='Confirmed').length;inv.textContent=localStorage.getItem('aaem_invitation')?'Saved':'Not started';gst.textContent=g.length?'Active':'Not started';loc.textContent=localStorage.getItem('aaem_location')?'Saved':'Not started';const t=JSON.parse(localStorage.getItem('aaem_tasks')||'[]');tasks.textContent=Math.round(t.length/8*100)+'%';pln.textContent=t.length?'In progress':'Not started';const b=JSON.parse(localStorage.getItem('aaem_budget')||'[]');bud.textContent=b.length?'Active':'Not started';</script></body></html>
