<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video Maker — AA : Event Maker</title><link rel="stylesheet" href="workspace.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">AA<span>:</span></span><span>Event Maker</span></a><nav class="nav"><a href="dashboard.html">Dashboard</a><a href="photo-maker.html">Photo</a><a class="active" href="video-maker.html">Video</a><a href="design-maker.html">Design</a></nav></header><main class="container"><span class="eyebrow">VIDEO STUDIO</span><h1>🎬 Video Maker</h1><p class="lead">Prepare event videos for invitation, prewedding, highlights and social media.</p><section class="card section"><div class="pill-grid"><button class="pill active" onclick="pick(this,'9:16')">9:16 Social</button><button class="pill" onclick="pick(this,'16:9')">16:9 Landscape</button><button class="pill" onclick="pick(this,'1:1')">1:1 Square</button></div><p id="format" class="muted">Selected: 9:16</p></section><section class="split section"><div class="card"><div class="form"><label>Video title<input id="vtitle" placeholder="Our Wedding Story"></label><label>Opening text<textarea id="vtext" placeholder="Save the date..."></textarea></label><label>Video file<input id="vfile" type="file" accept="video/*" onchange="previewVideo(this.files[0])"></label><button class="btn primary" onclick="saveVideo()">Save Video Concept</button><p id="saved" class="muted"></p></div></div><div class="card"><video id="player" controls style="width:100%;border-radius:16px;display:none"></video><div id="empty" class="empty">Video preview akan muncul di sini.</div></div></div></main><script>let fmt='9:16';function pick(el,x){document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));el.classList.add('active');fmt=x;format.textContent='Selected: '+x}function previewVideo(f){if(!f)return;player.src=URL.createObjectURL(f);player.style.display='block';empty.style.display='none'}function saveVideo(){localStorage.setItem('aaem_video',JSON.stringify({title:vtitle.value,text:vtext.value,format:fmt}));saved.textContent='✓ Video concept saved.'}</script></body></html>
