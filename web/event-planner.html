<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="assets/icon.svg"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Event Planner — AA : Event Maker</title><link rel="stylesheet" href="workspace.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">AA<span>:</span></span><span>Event Maker</span></a><nav class="nav"><a href="index.html">Home</a><a href="create.html">Create</a><a href="templates.html">Templates</a><a href="features.html">Features</a><a href="dashboard.html">Dashboard</a><a href="profile.html" id="navProfileLink">Profile</a></nav></header><main class="container"><a class="muted" href="dashboard.html">← Back to Dashboard</a><span class="eyebrow">EVENT PLANNER</span><h1>Plan every step.</h1><p class="lead">Checklist dan persiapan event tetap berada di dalam project yang sama.</p><section class="card section"><h2>Add task</h2><div class="form"><label>Task<input id="taskName" placeholder="e.g. Book photographer"></label><label>Deadline<input id="taskDeadline" type="date"></label><label>Responsible person<input id="taskOwner" placeholder="Who is handling this?"></label><label>Status<select id="taskStatus"><option>Not Started</option><option>In Progress</option><option>Done</option></select></label><button class="btn primary" onclick="addTask()">Add Task</button></div></section><section class="card section"><div id="tasks" class="list"></div></section></main><script src="app.js"></script><script>const defaults=['Venue','Catering','Decoration','Photography','Music','Invitation','Guest list','Transportation'];let plan=getPlanner();if(!plan.length){plan=defaults.map(t=>({task:t,deadline:'',owner:'',status:'Not Started'}));savePlanner(plan)}function render(){const pct=Math.round(plan.filter(t=>t.status==='Done').length/(plan.length||1)*100);tasks.innerHTML=`<div class="notice">${pct}% complete — ${plan.filter(t=>t.status==='Done').length}/${plan.length} tasks done</div>`+plan.map((t,i)=>`<div class="list-row"><span><strong>${t.task}</strong><br><small>Deadline: ${t.deadline||'—'} · Owner: ${t.owner||'Unassigned'}</small></span><span><select onchange="setStatus(${i},this.value)"><option ${t.status==='Not Started'?'selected':''}>Not Started</option><option ${t.status==='In Progress'?'selected':''}>In Progress</option><option ${t.status==='Done'?'selected':''}>Done</option></select> <button class="btn light" onclick="removeTask(${i})">Remove</button></span></div>`).join('')}function addTask(){if(!taskName.value.trim())return;plan.push({task:taskName.value.trim(),deadline:taskDeadline.value,owner:taskOwner.value,status:taskStatus.value});savePlanner(plan);taskName.value='';taskDeadline.value='';taskOwner.value='';render()}function setStatus(i,v){plan[i].status=v;savePlanner(plan);render()}function removeTask(i){plan.splice(i,1);savePlanner(plan);render()}render()</script></body></html>
