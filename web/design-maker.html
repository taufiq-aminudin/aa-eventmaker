<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="assets/icon.svg"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Design Maker — AA : Event Maker</title><link rel="stylesheet" href="workspace.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">AA<span>:</span></span><span>Event Maker</span></a><nav class="nav"><a href="index.html">Home</a><a href="create.html">Create</a><a href="templates.html">Templates</a><a href="features.html">Features</a><a href="dashboard.html">Dashboard</a><a href="profile.html" id="navProfileLink">Profile</a></nav></header><main class="container"><a class="muted" href="dashboard.html">← Back to Dashboard</a><span class="eyebrow">DESIGN STUDIO</span><h1>🎨 Design Maker</h1><p class="lead">Create event posters, stories, banners, welcome signs, table numbers and social content.</p><section class="card section"><div class="pill-grid"><button class="pill" onclick="choose(this,'Poster')">Poster</button><button class="pill active" onclick="choose(this,'Instagram Post 1:1')">Post</button><button class="pill" onclick="choose(this,'Instagram Story 9:16')">Story</button><button class="pill" onclick="choose(this,'Banner 16:9')">Banner</button><button class="pill" onclick="choose(this,'Welcome Sign')">Welcome Sign</button><button class="pill" onclick="choose(this,'Table Number')">Table Number</button><button class="pill" onclick="choose(this,'Thank You Card')">Thank You Card</button><button class="pill" onclick="choose(this,'Social Media')">Social Media</button></div><p id="size" class="muted">Format: Instagram Post 1:1</p></section><div class="split section"><section class="card"><div class="form"><label>Headline<input id="headline" placeholder="Welcome to our celebration"></label><label>Subtext<input id="subtext" placeholder="Create. Celebrate. Remember."></label><label>Upload background<input id="bg" type="file" accept="image/*" onchange="bgPreview(this.files[0])"></label><button class="btn primary" onclick="saveDesign()">Save Design Concept</button><p id="saved" class="muted"></p></div></section><section id="canvas" class="preview-box"><div><span>AA : EVENT MAKER</span><h2 id="ph">Your Event</h2><p id="ps">Create. Celebrate. Remember.</p></div></section></div></main><script>let f='Instagram Post 1:1';function choose(el,x){document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));el.classList.add('active');f=x;size.textContent='Format: '+x}headline.addEventListener('input',()=>ph.textContent=headline.value||'Your Event');subtext.addEventListener('input',()=>ps.textContent=subtext.value||'Create. Celebrate. Remember.');function bgPreview(file){if(file)canvas.style.background=`url(${URL.createObjectURL(file)}) center/cover`}function saveDesign(){localStorage.setItem('aaEventMakerDesign',JSON.stringify({format:f,headline:headline.value,subtext:subtext.value}));saved.textContent='✓ Design concept saved.'}</script><script src="app.js"></script></body></html>
