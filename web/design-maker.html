<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Design Maker — AA : Event Maker</title><link rel="stylesheet" href="workspace.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">AA<span>:</span></span><span>Event Maker</span></a><nav class="nav"><a href="dashboard.html">Dashboard</a><a href="photo-maker.html">Photo</a><a href="video-maker.html">Video</a><a class="active" href="design-maker.html">Design</a></nav></header><main class="container"><span class="eyebrow">DESIGN STUDIO</span><h1>🎨 Design Maker</h1><p class="lead">Create event posters, stories, banners, welcome signs, table numbers and social content.</p><section class="card section"><div class="pill-grid"><button class="pill active" onclick="choose(this,'Instagram Post 1:1')">Post</button><button class="pill" onclick="choose(this,'Instagram Story 9:16')">Story</button><button class="pill" onclick="choose(this,'Banner 16:9')">Banner</button><button class="pill" onclick="choose(this,'Welcome Sign')">Welcome Sign</button><button class="pill" onclick="choose(this,'Table Number')">Table Number</button></div><p id="size" class="muted">Format: Instagram Post 1:1</p></section><div class="split section"><section class="card"><div class="form"><label>Headline<input id="headline" placeholder="Welcome to our celebration"></label><label>Subtext<input id="subtext" placeholder="Create. Celebrate. Remember."></label><label>Upload background<input id="bg" type="file" accept="image/*" onchange="bgPreview(this.files[0])"></label><button class="btn primary" onclick="saveDesign()">Save Design Concept</button><p id="saved" class="muted"></p></div></section><section id="canvas" class="preview-box"><div><span>AA : EVENT MAKER</span><h2 id="ph">Your Event</h2><p id="ps">Create. Celebrate. Remember.</p></div></section></div></main><script>let f='Instagram Post 1:1';function choose(el,x){document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));el.classList.add('active');f=x;size.textContent='Format: '+x}headline.addEventListener('input',()=>ph.textContent=headline.value||'Your Event');subtext.addEventListener('input',()=>ps.textContent=subtext.value||'Create. Celebrate. Remember.');function bgPreview(file){if(file)canvas.style.background=`url(${URL.createObjectURL(file)}) center/cover`}function saveDesign(){localStorage.setItem('aaem_design',JSON.stringify({format:f,headline:headline.value,subtext:subtext.value}));saved.textContent='✓ Design concept saved.'}</script></body></html>
