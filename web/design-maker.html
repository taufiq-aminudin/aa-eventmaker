<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><title>Design Maker — AA : Event Maker</title>
<link rel="stylesheet" href="styles.css"></head>
<body class="" data-active="">
<div id="masterHeader"></div>

<main class="container"><div class="page-top"><a class="back" href="dashboard.html">← Project Workspace</a><span class="pill">🎨 Design Studio</span></div><span class="eyebrow">DESIGN MAKER</span><h1>Create the event visual system.</h1><p class="lead">Build supporting graphics and save the design brief inside the Project.</p>
<section class="split section"><section class="card"><div class="form"><label>Output<select id="designType"><option>Poster</option><option>Instagram Story</option><option>Social Post</option><option>Banner</option><option>Welcome Sign</option><option>Table Number</option><option>Thank You Card</option></select></label><label>Headline<input id="designHeadline" placeholder="YOUR EVENT"></label><label>Subheadline<input id="designSub" placeholder="DATE · VENUE"></label><label>Notes<textarea id="designNotes" placeholder="Visual direction, size, copy, assets..."></textarea></label><button class="btn primary" onclick="saveDesign()">Save Design →</button></div></section>
<section class="card"><span class="eyebrow">LIVE PREVIEW</span><div id="designCanvas" style="min-height:520px;border-radius:20px;background:linear-gradient(145deg,#111827,#6d28d9 55%,#ec4899);display:grid;place-items:center;text-align:center;color:#fff;padding:40px"><div><div id="dpType">POSTER</div><h2 id="dpHead">YOUR EVENT</h2><p id="dpSub">DATE · VENUE</p></div></div></section></section>
</main>
<script>
['designType','designHeadline','designSub'].forEach(id=>document.getElementById(id).addEventListener('input',updateDesignPreview));
function updateDesignPreview(){dpType.textContent=designType.value.toUpperCase();dpHead.textContent=designHeadline.value||'YOUR EVENT';dpSub.textContent=designSub.value||'DATE · VENUE'}
</script>

<div id="masterFooter"></div>
<script src="app.js"></script></body></html>
