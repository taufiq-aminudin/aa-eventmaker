<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="assets/icon.svg"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Budget — AA : Event Maker</title><link rel="stylesheet" href="workspace.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">AA<span>:</span></span><span>Event Maker</span></a><nav class="nav"><a href="index.html">Home</a><a href="create.html">Create</a><a href="templates.html">Templates</a><a href="features.html">Features</a><a href="dashboard.html">Dashboard</a><a href="profile.html" id="navProfileLink">Profile</a></nav></header><main class="container"><a class="muted" href="dashboard.html">← Back to Dashboard</a><span class="eyebrow">EVENT BUDGET</span><h1>Plan your spending.</h1><p class="lead">Track vendor and event costs inside the same project.</p><div class="stats"><div class="stat"><span class="muted">Items</span><b id="count">0</b></div><div class="stat"><span class="muted">Planned</span><b id="planned">Rp 0</b></div><div class="stat"><span class="muted">Actual</span><b id="paid">Rp 0</b></div><div class="stat"><span class="muted">Remaining</span><b id="remain">Rp 0</b></div></div><div class="split section"><section class="card"><h2>Add expense</h2><div class="form"><label>Item<input id="item" placeholder="Venue, catering, decoration..."></label><label>Category<select id="category"><option>Venue</option><option>Catering</option><option>Decoration</option><option>Photography</option><option>Video</option><option>Entertainment</option><option>Invitation</option><option>Transportation</option><option>Other</option></select></label><label>Planned amount<input id="amount" type="number" min="0" placeholder="5000000"></label><label>Actual amount<input id="actual" type="number" min="0" placeholder="0"></label><label>Status<select id="status"><option>Planned</option><option>Paid</option></select></label><button class="btn primary" onclick="addBudget()">Add Item</button></div></section><section class="card"><h2>Budget list</h2><div id="list" class="list"></div></section></div></main><script src="app.js"></script><script>let b=getBudget();function money(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n||0)}function render(){count.textContent=b.length;const pl=b.reduce((s,x)=>s+(x.amount||0),0),ac=b.reduce((s,x)=>s+(x.actual||0),0);planned.textContent=money(pl);paid.textContent=money(ac);remain.textContent=money(pl-ac);list.innerHTML=b.length?b.map((x,i)=>`<div class="list-row"><span><span class="badge">${x.category||'Other'}</span> <strong>${x.item}</strong><br><small>Planned ${money(x.amount)} · Actual ${money(x.actual)} · ${x.status}</small></span><button class="btn light" onclick="removeBudget(${i})">Remove</button></div>`).join(''):'<p class="muted">No budget items yet.</p>'}function addBudget(){const n=Number(amount.value);if(!item.value.trim()||!n)return;b.push({item:item.value.trim(),category:category.value,amount:n,actual:Number(actual.value)||0,status:status.value});saveBudget(b);item.value='';amount.value='';actual.value='';render()}function removeBudget(i){b.splice(i,1);saveBudget(b);render()}render()</script></body></html>
