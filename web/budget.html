<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><title>Budget — AA : Event Maker</title>
<link rel="stylesheet" href="styles.css"></head>
<body class="" data-active="">
<div id="masterHeader"></div>

<main class="container"><div class="page-top"><a class="back" href="dashboard.html">← Project Workspace</a><span class="pill">💰 Budget</span></div><span class="eyebrow">BUDGET</span><h1>Keep the event on track.</h1><p class="lead">Plan, record and understand event spending.</p>
<section class="stat-grid section"><div class="stat"><span>Planned</span><b id="totalPlan">Rp 0</b></div><div class="stat"><span>Actual</span><b id="totalActual">Rp 0</b></div><div class="stat"><span>Remaining</span><b id="remaining">Rp 0</b></div><div class="stat"><span>Items</span><b id="budgetItems">0</b></div></section>
<section class="split section"><section class="card"><div class="form"><label>Category<select id="budgetCat"><option>Venue</option><option>Catering</option><option>Decoration</option><option>Photography</option><option>Video</option><option>Entertainment</option><option>Invitation</option><option>Transportation</option><option>Other</option></select></label><label>Planned (IDR)<input id="budgetPlan" type="number" min="0" placeholder="0"></label><label>Actual (IDR)<input id="budgetActual" type="number" min="0" placeholder="0"></label><button class="btn primary" onclick="addBudget()">Add Budget →</button></div></section><section class="card"><span class="eyebrow">BUDGET ITEMS</span><div id="budgetList" class="list"></div></section></section>
</main>

<div id="masterFooter"></div>
<script src="app.js"></script></body></html>
