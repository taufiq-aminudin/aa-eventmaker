<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Budget — AA : Event Maker</title><link rel="stylesheet" href="styles.css"></head><body>

</header><main class="container"><div class="page-actions"><a class="back" href="dashboard.html">← Dashboard</a></div><span class="eyebrow">BUDGET</span><h1>Budget</h1><p class="lead">Kelola planned, actual dan remaining event spending.</p><section class="split section"><section class="card"><div class="form"><label>Category<select id="budgetCat"><option>Venue</option><option>Catering</option><option>Decoration</option><option>Photography</option><option>Video</option><option>Entertainment</option><option>Invitation</option><option>Transportation</option><option>Other</option></select></label><label>Planned (IDR)<input id="budgetPlan" type="number" min="0"></label><label>Actual (IDR)<input id="budgetActual" type="number" min="0"></label><button class="btn primary" onclick="addBudget()">Add Budget →</button></div></section><section class="card"><span class="eyebrow">SUMMARY</span><h2>Budget control</h2><div class="list"><div class="list-row"><span>Total planned</span><strong id="totalPlan">Rp 0</strong></div><div class="list-row"><span>Total actual</span><strong id="totalActual">Rp 0</strong></div><div class="list-row"><span>Remaining</span><strong id="remaining">Rp 0</strong></div></div></section></div><section class="card section"><h2>Budget Items</h2><div id="budgetList" class="list"></div></section>
<script>function updateBudgetSummary(){const a=read(KEY.budget,[]),p=a.reduce((s,x)=>s+x.planned,0),r=a.reduce((s,x)=>s+x.actual,0);totalPlan.textContent='Rp '+p.toLocaleString('id-ID');totalActual.textContent='Rp '+r.toLocaleString('id-ID');remaining.textContent='Rp '+(p-r).toLocaleString('id-ID')}const oldRender=renderBudget;renderBudget=function(){oldRender();updateBudgetSummary()};renderBudget();</script><section class="section grid"></section></main><script src="app.js"></script></body></html>
