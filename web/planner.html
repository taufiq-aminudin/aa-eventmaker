<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event Planner — AA : Event Maker</title><link rel="stylesheet" href="workspace.css"></head><body><header class="topbar"><a class="brand" href="dashboard.html"><span class="brand-mark">AA<span>:</span></span><span>Event Maker</span></a><nav class="nav"><a href="dashboard.html">Dashboard</a><a class="active" href="event-planner.html">Planner</a><a href="budget.html">Budget</a><a href="guest-manager.html">Guests</a></nav></header><main class="container"><span class="eyebrow">EVENT PLANNER</span><h1>Plan every step.</h1><p class="lead">Checklist dan persiapan event tetap berada di dalam project yang sama.</p><section class="card section"><div id="tasks" class="list"></div></section></main><script>const ts=['Choose invitation template','Add event details','Add venue and map','Import guest list','Send invitations','Review RSVP','Prepare QR check-in','Create event memories'];let done=JSON.parse(localStorage.getItem('aaem_tasks')||'[]');function render(){tasks.innerHTML=ts.map((t,i)=>`<label class="list-row check"><span><input type="checkbox" ${done.includes(i)?'checked':''} onchange="toggle(${i},this.checked)"> ${t}</span><span>${done.includes(i)?'✓ Done':'Pending'}</span></label>`).join('')}function toggle(i,v){done=v?[...new Set([...done,i])]:done.filter(x=>x!==i);localStorage.setItem('aaem_tasks',JSON.stringify(done));render()}render()</script></body></html>
