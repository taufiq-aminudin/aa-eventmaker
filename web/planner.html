<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event Planner — AA : Event Maker</title><link rel="stylesheet" href="dashboard.css"></head><body><header class="topbar"><a class="brand" href="dashboard.html"><span class="brand-mark">AA<span>:</span></span><span>Event Maker</span></a><a class="btn light" href="dashboard.html">← Dashboard</a></header><main class="container"><span class="eyebrow">EVENT PLANNER</span><h1>📅 Plan your event</h1><p class="muted">Keep preparation tasks and timeline in one place.</p><section class="card section"><div id="tasks" class="list"></div></section></main><script>const ts=['Choose invitation template','Add event details','Add venue and map','Import guest list','Send invitations','Review RSVP','Prepare QR check-in','Create event memories'];let done=JSON.parse(localStorage.getItem("aaem_tasks")||"[]");tasks.innerHTML=ts.map((t,i)=>`<label class="list-row"><span><input type="checkbox" ${done.includes(i)?'checked':''} onchange="toggle(${i},this.checked)"> ${t}</span><span>${done.includes(i)?'✓ Done':'Pending'}</span></label>`).join("");function toggle(i,v){done=v?[...new Set([...done,i])]:done.filter(x=>x!==i);localStorage.setItem("aaem_tasks",JSON.stringify(done));location.reload()}</script></body></html>
