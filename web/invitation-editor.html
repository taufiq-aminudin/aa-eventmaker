<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><title>Invitation Editor — AA : Event Maker</title>
<link rel="stylesheet" href="styles.css"></head>
<body class="" data-active="">
<div id="masterHeader"></div>
<main class="container"><div class="page-top"><a class="back" href="invitation-maker.html">← Invitation Maker</a><span class="pill">Editor</span></div><span class="eyebrow">INVITATION EDITOR</span><h1>Make the invitation yours.</h1><p class="lead">Changes are saved into the active Project and reused by Preview, Publish and Share.</p>
<section class="workspace section"><section class="card"><div class="form"><label>Template<select id="template" onchange="templateChanged()"><option>Sunda Halus</option><option>Jawa Tengah</option><option>Solo Heritage</option><option>Jogja Royal</option><option>Bali Ayu</option><option>Nusantara</option><option>Modern Indonesian</option><option>Malay Elegance</option><option>Chinese Modern</option><option>Indian Celebration</option><option>Japanese Minimal</option><option>Korean Modern</option><option>Arabic Elegance</option><option>Persian Garden</option><option>French Romance</option><option>Italian Villa</option><option>British Classic</option><option>Nordic Minimal</option><option>African Celebration</option><option>Latin Romance</option><option>American Classic</option><option>Brazilian Tropical</option><option>Oceanic Beach</option><option>International Classic</option><option>Birthday Pop</option><option>Baby Story</option><option>Graduation Modern</option><option>Engagement Bloom</option><option>Anniversary Gold</option><option>Party Night</option><option>Corporate Summit</option><option>Seminar Clean</option><option>Product Launch</option><option>Community Day</option><option>Content-Friendly Wedding</option><option>Sustainable Botanical</option><option>Pastel Dreamy</option><option>Monochrome Elegant</option><option>Wedding Festival</option><option>Adat Modern</option><option>Ballroom Classic</option><option>Intimate Wedding</option><option>Elegant White</option><option>Modern Minimalist</option><option>Rustic Modern</option><option>Garden Romance</option></select></label><label>Event title<input id="title" placeholder="Your Event"></label><label>Opening message<textarea id="opening" placeholder="Your invitation message"></textarea></label><label>Date<input id="date" type="date"></label><label>Time<input id="time" type="time"></label><label>Venue<input id="venue" placeholder="Your Venue"></label><label>Public slug<input id="slug" placeholder="your-event"></label><button class="btn primary" onclick="saveInvitation()">Save & Open Detail →</button><span id="saved" class="muted"></span></div></section>
<section class="preview-shell"><div class="preview-card"><img id="templateVisual" class="template-preview-visual" alt="Invitation template preview"><div><span>YOU ARE INVITED</span><h2 id="pvTitle">Your Event</h2><p id="pvOpening"></p><p id="pvDate">Your date · Your time</p><p id="pvVenue">Your Venue</p><a class="btn light" href="invitation-detail.html">Open Detail →</a></div></div></section></section>
</main>
<script>document.addEventListener('DOMContentLoaded',function(){['title','opening','date','time','venue','template'].forEach(function(id){var e=document.getElementById(id);if(e)e.addEventListener('input',function(){updateEditorPreview();if(id==='template'){var i=document.getElementById('templateVisual');if(i){i.style.display='block';i.onerror=function(){this.onerror=null;this.src='assets/'+slugify(e.value)+'.svg'};i.src=templateAsset(e.value)}}})})});</script>
<div id="masterFooter"></div>
<script src="app.js"></script></body></html>
