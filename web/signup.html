<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><title>Sign Up — AA : Event Maker</title>
<link rel="stylesheet" href="styles.css"></head>
<body class="" data-active="">
<div id="masterHeader"></div>

<main class="container"><section class="split" style="max-width:940px;margin:28px auto"><section class="hero"><div class="hero-copy"><span class="eyebrow">CREATE ACCOUNT</span><h1>One account for your events.</h1><p class="lead">After signup you are automatically logged in. Your project data and media are kept separate by account on this device.</p></div></section>
<section class="card"><span class="eyebrow">ACCOUNT</span><h2>Sign Up</h2><div class="form"><label>Name<input id="signupName" autocomplete="name" placeholder="Your name"></label><label>Email<input id="signupEmail" type="email" autocomplete="email" placeholder="you@example.com"></label><label>Password<input id="signupPassword" type="password" autocomplete="new-password" placeholder="Minimum 6 characters"></label><label>Confirm password<input id="signupConfirm" type="password" autocomplete="new-password" placeholder="Repeat password"></label><button class="btn primary" onclick="signup()">Create Account →</button><p class="muted">Sudah punya akun? <a href="login.html" style="color:#6941c6;font-weight:800">Login</a></p></div></section></section></main>

<div id="masterFooter"></div>
<script src="app.js"></script></body></html>
