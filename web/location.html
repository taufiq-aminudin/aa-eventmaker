<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Location — AA : Event Maker</title><link rel="stylesheet" href="dashboard.css"></head><body><header class="topbar"><a class="brand" href="dashboard.html"><span class="brand-mark">AA<span>:</span></span><span>Event Maker</span></a><a class="btn light" href="dashboard.html">← Dashboard</a></header><main class="container"><span class="eyebrow">LOCATION STUDIO</span><h1>📍 Event Locations</h1><p class="muted">Save ceremony, reception, parking and meeting-point locations.</p><div class="detail"><section class="card"><div class="form"><label>Venue name<input id="venueName" value="Grand Garden Venue"></label><label>Address<textarea id="address">123 Garden Street</textarea></label><label>Map URL<input id="mapurl" placeholder="https://maps.google.com/..."></label><button class="btn primary" onclick="saveLoc()">Save Location</button><p id="saved" class="muted"></p></div></section><section class="card"><div class="map" style="height:320px;border-radius:18px;background:linear-gradient(135deg,#dbeafe,#dcfce7);display:grid;place-items:center;font-size:70px">📍</div></section></div></main><script>function saveLoc(){localStorage.setItem("aaem_location",JSON.stringify({name:venueName.value,address:address.value,url:mapurl.value}));saved.textContent="✓ Location saved."}</script></body></html>
