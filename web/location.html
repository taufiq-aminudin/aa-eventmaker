<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Location — AA : Event Maker</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="app.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">AA<span>:</span></span><span>Event Maker</span></a><nav class="nav"><a class="" href="index.html">Home</a><a class="" href="create.html">Create</a><a class="" href="templates.html">Templates</a><a class="" href="features.html">Features</a><a class="" href="dashboard.html">Dashboard</a></nav><div class="actions" style="margin:0"><a class="btn light" href="login.html">Login</a><a class="btn dark" href="create.html">Create Event</a></div></header><main class="container"><div class="page-actions"><a class="back" href="dashboard.html">← Project Workspace</a></div><span class="eyebrow">EVENT LOCATION</span><h1>Bring guests to the right place.</h1><p class="lead">Store venue details and a navigation link for the invitation.</p><section class="split section"><section class="card"><div class="form"><label>Location type<select id="locType"><option>Main Venue</option><option>Ceremony</option><option>Reception</option><option>Meeting</option><option>Custom</option></select></label><label>Venue name<input id="locName" placeholder="Your Venue"></label><label>Address<input id="locAddress" placeholder="Full address"></label><label>Map / Navigation URL<input id="locUrl" placeholder="https://maps.google.com/..."></label><button class="btn primary" onclick="saveLocation()">Save Location →</button><p id="locSaved" class="muted"></p></div></section><section class="card"><span class="eyebrow">LOCATION PREVIEW</span><div id="locationPreview"><div class="empty">Add your venue to see it here.</div></div></section></section></main><script src="app.js"></script></body></html>
