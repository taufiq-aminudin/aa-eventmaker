<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Location — AA : Event Maker</title><link rel="stylesheet" href="workspace.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">AA<span>:</span></span><span>Event Maker</span></a><nav class="nav"><a href="dashboard.html">Dashboard</a><a class="active" href="location.html">Location</a><a href="guest-manager.html">Guests</a></nav></header><main class="container"><span class="eyebrow">LOCATION</span><h1>📍 Event locations</h1><p class="lead">Simpan ceremony, reception, parking, meeting point atau beberapa venue dalam satu event.</p><div class="split section"><section class="card"><div class="form"><label>Venue name<input id="venueName" value="Grand Garden Venue"></label><label>Address<textarea id="address">Your event address</textarea></label><label>Map URL<input id="mapurl" placeholder="https://maps.google.com/..."></label><button class="btn primary" onclick="saveLoc()">Save Location</button><p id="saved" class="muted"></p></div></section><section class="card"><div style="height:330px;border-radius:18px;background:linear-gradient(135deg,#dbeafe,#dcfce7);display:grid;place-items:center;font-size:70px">📍</div><a id="maps" class="btn dark" style="margin-top:14px;display:none" target="_blank" rel="noopener">Open Map</a></section></div></main><script>const old=JSON.parse(localStorage.getItem('aaem_location')||'null');if(old){venueName.value=old.name||'';address.value=old.address||'';mapurl.value=old.url||'';showMap()}function showMap(){if(mapurl.value){maps.href=mapurl.value;maps.style.display='inline-flex'}}function saveLoc(){localStorage.setItem('aaem_location',JSON.stringify({name:venueName.value,address:address.value,url:mapurl.value}));showMap();saved.textContent='✓ Location saved.'}</script></body></html>
