<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Location — AA : Event Maker</title><link rel="stylesheet" href="workspace.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">AA<span>:</span></span><span>Event Maker</span></a><nav class="nav"><a href="index.html">Home</a><a href="create.html">Create</a><a href="templates.html">Templates</a><a href="features.html">Features</a><a href="dashboard.html">Dashboard</a></nav></header><main class="container"><a class="muted" href="dashboard.html">← Back to Dashboard</a><span class="eyebrow">LOCATION</span><h1>📍 Event locations</h1><p class="lead">Simpan ceremony, reception, parking, meeting point atau beberapa venue dalam satu event.</p><div class="split section"><section class="card"><h2>Add venue</h2><div class="form"><label>Venue type<select id="venueType"><option>Ceremony</option><option>Reception</option><option>Meeting Point</option><option>Custom</option></select></label><label>Venue name<input id="venueName" placeholder="Grand Garden Venue"></label><label>Address<textarea id="address" placeholder="Full venue address"></textarea></label><label>Google Maps link<input id="mapurl" placeholder="https://maps.google.com/..."></label><button class="btn primary" onclick="saveLoc()">Save Venue</button><p id="saved" class="muted"></p></div></section><section class="card"><div style="height:220px;border-radius:18px;background:linear-gradient(135deg,#dbeafe,#dcfce7);display:grid;place-items:center;font-size:60px">📍</div><h2 style="margin-top:16px">Saved venues</h2><div id="list" class="list"></div></section></div></main><script src="app.js"></script><script>let locs=getLocationData();function render(){list.innerHTML=locs.length?locs.map((x,i)=>`<div class="list-row"><span><span class="badge">${x.type}</span> <strong>${x.name}</strong><br><small>${x.address||''}</small></span><span>${x.url?`<a class="btn light" target="_blank" rel="noopener" href="${x.url}">Open Map</a> `:''}<button class="btn light" onclick="removeLoc(${i})">Remove</button></span></div>`).join(''):'<p class="muted">Belum ada venue.</p>'}function saveLoc(){if(!venueName.value.trim()){toast('Masukkan nama venue');return}locs.push({type:venueType.value,name:venueName.value.trim(),address:address.value,url:mapurl.value});saveLocationData(locs);venueName.value='';address.value='';mapurl.value='';saved.textContent='✓ Venue saved.';render()}function removeLoc(i){locs.splice(i,1);saveLocationData(locs);render()}render()</script></body></html>
