</header><main class="container"><div class="page-actions"><a class="back" href="dashboard.html">← Dashboard</a></div><span class="eyebrow">LOCATION</span><h1>Location</h1><p class="lead">Simpan venue, alamat, map pin dan navigation link.</p><section class="split section"><section class="card"><div class="form"><label>Venue name<input id="locName" placeholder="Grand Garden Venue"></label><label>Address<input id="locAddress" placeholder="Full venue address"></label><label>Google Maps URL<input id="locUrl" placeholder="https://maps.google.com/..."></label><button class="btn primary" onclick="saveLocation()">Save Location →</button><p id="locSaved" class="muted"></p></div></section><section class="card"><span class="eyebrow">MULTIPLE VENUES</span><h2>Event locations</h2><div class="list"><div class="list-row"><span>Ceremony</span><strong>Venue</strong></div><div class="list-row"><span>Reception</span><strong>Venue</strong></div><div class="list-row"><span>Meeting / Custom</span><strong>Optional</strong></div></div></section></div>
<script>const l=read(KEY.location,null);if(l){locName.value=l.name||'';locAddress.value=l.address||'';locUrl.value=l.url||''}function saveLocation(){write(KEY.location,{name:locName.value,address:locAddress.value,url:locUrl.value});locSaved.textContent='✓ Location tersimpan';toast('Location saved')}</script><section class="section grid"></section></main><script src="app.js"></script></body></html>
