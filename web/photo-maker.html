<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photo Maker — AA : Event Maker</title><link rel="stylesheet" href="workspace.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">AA<span>:</span></span><span>Event Maker</span></a><nav class="nav"><a href="dashboard.html">Dashboard</a><a class="active" href="photo-maker.html">Photo</a><a href="video-maker.html">Video</a><a href="design-maker.html">Design</a></nav></header><main class="container"><span class="eyebrow">PHOTO STUDIO</span><h1>📸 Photo Maker</h1><p class="lead">Upload and prepare photos for invitations, videos and event designs.</p><section class="card section upload"><h2>Add photos</h2><p class="muted">Pilih file gambar dari perangkat. Preview disimpan di browser pada versi prototype ini.</p><input id="files" type="file" accept="image/*" multiple onchange="previewPhotos(this.files)"></section><section class="grid section" id="gallery"><div class="empty">Belum ada foto.</div></section><section class="section toolbar"><a class="btn primary" href="invitation-maker.html">Use in Invitation</a><a class="btn light" href="video-maker.html">Use in Video</a><a class="btn light" href="design-maker.html">Use in Design</a></section></main><script>function previewPhotos(fs){const g=document.getElementById('gallery');g.innerHTML='';[...fs].forEach((f,i)=>{const u=URL.createObjectURL(f);const d=document.createElement('div');d.className='card';d.innerHTML=`<img src="${u}" alt="Photo ${i+1}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px"><h3>${f.name}</h3><p class="muted">Photo asset ${i+1}</p>`;g.appendChild(d)})}</script></body></html>
