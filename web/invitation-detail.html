<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Invitation — AA : Event Maker</title><link rel="stylesheet" href="dashboard.css"><style>
.public{max-width:760px;margin:auto}.cover{min-height:92vh;border-radius:0 0 35px 35px;background:linear-gradient(145deg,#111827,#4c1d95 55%,#ec4899);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px}.cover h1{font-size:clamp(48px,9vw,82px);margin:15px 0}.cover p{max-width:550px;line-height:1.7;color:#eee}.public-section{background:#fff;margin:20px 0;border-radius:24px;padding:30px;border:1px solid #e7e9ee}.map{height:220px;border-radius:18px;background:linear-gradient(135deg,#dbeafe,#dcfce7);display:grid;place-items:center;font-size:55px}.rsvp{display:grid;gap:10px}.rsvp input,.rsvp select{padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit}
</style></head><body><div class="public"><section class="cover"><div><span>YOU ARE INVITED</span><h1 id="title">Sari & Agus</h1><p id="opening">Together with our families, we invite you to celebrate our special day.</p><p id="date">10 October 2026 · 10:00</p><button class="btn light" onclick="document.getElementById('rsvp').scrollIntoView({behavior:'smooth'})">RSVP</button></div></section>
<section class="public-section"><span class="eyebrow">THE EVENT</span><h2>Celebration Details</h2><div class="list"><div class="list-row"><span>Date</span><strong id="d1">10 October 2026</strong></div><div class="list-row"><span>Time</span><strong id="d2">10:00</strong></div><div class="list-row"><span>Venue</span><strong id="venue">Grand Garden Venue</strong></div></div></section>
<section class="public-section"><span class="eyebrow">LOCATION</span><h2>Find the venue</h2><div class="map">📍</div><button class="btn dark" style="margin-top:14px" onclick="alert('Maps navigation will open here in production.')">Get Directions</button></section>
<section class="public-section"><span class="eyebrow">RSVP</span><h2>Will you join us?</h2><div id="rsvp" class="rsvp"><input id="guest" placeholder="Your name"><select id="answer"><option>Yes, I will attend</option><option>Sorry, I cannot attend</option></select><select id="pax"><option>1 guest</option><option>2 guests</option><option>3 guests</option></select><button class="btn primary" onclick="submitRsvp()">Confirm RSVP</button><p id="r"></p></div></section>
<section class="public-section"><span class="eyebrow">SHARE</span><h2>Invite your friends</h2><button class="btn light" onclick="navigator.clipboard?.writeText(location.href);alert('Link copied')">Copy Link</button></section>
</div><script>
const d=JSON.parse(localStorage.getItem("aaem_invitation")||"null");if(d){title.textContent=d.title;opening.textContent=d.opening;d2.textContent=d.time;venue.textContent=d.venue;const ds=d.date?new Date(d.date+"T00:00:00").toLocaleDateString("en-GB",{day:"2-digit",month:"long",year:"numeric"}):"Your date";date.textContent=ds+" · "+d.time;d1.textContent=ds}function submitRsvp(){if(!guest.value.trim()){r.textContent="Please enter your name.";return}localStorage.setItem("aaem_last_rsvp",JSON.stringify({name:guest.value,answer:answer.value,pax:pax.value}));r.textContent="✓ Thank you, your RSVP has been recorded.";r.style.color="#15803d"}
</script></body></html>
