<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Invitation — AA : Event Maker</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="app.css"></head><body class="public"><section class="cover"><div><span class="eyebrow">YOU ARE INVITED</span><h1 id="sTitle">Your Event</h1><p id="sOpening"></p><p id="sDate"></p><p id="sVenue"></p><div class="actions" style="justify-content:center"><button class="btn light" onclick="copyLink()">Copy Link</button><a class="btn dark" href="index.html">AA : Event Maker</a></div></div></section><section class="public-section"><span class="eyebrow">EVENT DETAILS</span><h2>Celebration</h2><div class="list"><div class="list-row"><span>Date</span><strong id="dDate">—</strong></div><div class="list-row"><span>Time</span><strong id="dTime">—</strong></div><div class="list-row"><span>Venue</span><strong id="dVenue">—</strong></div></div></section><section class="public-section"><div class="notice">This invitation was created with AA : Event Maker.</div></section><script src="app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{recordPublicView();const d=openSharedInvitation();if(!d){document.getElementById('sTitle').textContent='Invitation not found';return}const $=id=>document.getElementById(id);$('sTitle').textContent=d.title||'Your Event';$('sOpening').textContent=d.opening||'';$('sDate').textContent=d.date||'Your date';$('sVenue').textContent=d.venue||'Venue';$('dDate').textContent=d.date||'—';$('dTime').textContent=d.time||'—';$('dVenue').textContent=d.venue||'—';});</script></body></html>
