<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guest Manager — AA : Event Maker</title><link rel="stylesheet" href="workspace.css"></head><body><header class="topbar"><a class="brand" href="dashboard.html"><span class="brand-mark">AA<span>:</span></span><span>Event Maker</span></a><nav class="nav"><a href="dashboard.html">Dashboard</a><a class="active" href="guests.html">Guests</a><a href="invitation-detail.html">Public Invitation</a></nav></header><main class="container"><span class="eyebrow">GUEST MANAGER</span><h1>Guests & RSVP.</h1><p class="lead">Guest list, personalized invitation concept, RSVP status and check-in preparation.</p><div class="stats"><div class="stat"><span class="muted">Total guests</span><b id="count">0</b></div><div class="stat"><span class="muted">Confirmed</span><b id="confirmed">0</b></div><div class="stat"><span class="muted">Pending</span><b id="pending">0</b></div><div class="stat"><span class="muted">Declined</span><b id="declined">0</b></div></div><div class="split section"><section class="card"><h2>Add guest</h2><div class="form"><label>Name<input id="name" placeholder="Guest name"></label><label>Phone<input id="phone" placeholder="+62..."></label><label>Group<select id="group"><option>Family</option><option>Friend</option><option>Colleague</option><option>Other</option></select></label><button class="btn primary" onclick="addGuest()">Add Guest</button></div></section><section class="card"><h2>Guest list</h2><div id="list" class="list"></div></section></div></main><script>let gs=JSON.parse(localStorage.getItem('aaem_guests')||'[]');function render(){count.textContent=gs.length;confirmed.textContent=gs.filter(x=>x.rsvp==='Confirmed').length;pending.textContent=gs.filter(x=>x.rsvp==='Pending').length;declined.textContent=gs.filter(x=>x.rsvp==='Declined').length;list.innerHTML=gs.length?gs.map((x,i)=>`<div class="list-row"><span><strong>${x.name}</strong><br><small>${x.group} · ${x.phone||'No phone'}</small></span><span><span class="badge">${x.rsvp}</span> <button class="btn light" onclick="removeG(${i})">Remove</button></span></div>`).join(''):'<p class="muted">No guests yet.</p>'}function addGuest(){if(!name.value.trim())return;gs.push({name:name.value.trim(),phone:phone.value,group:group.value,rsvp:'Pending'});localStorage.setItem('aaem_guests',JSON.stringify(gs));name.value='';phone.value='';render()}function removeG(i){gs.splice(i,1);localStorage.setItem('aaem_guests',JSON.stringify(gs));render()}render()</script></body></html>
